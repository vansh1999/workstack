apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: workstack
spec:
  replicas: 1
  # RollingUpdate would try to start a second pod needing the same
  # ReadWriteOnce PVC while the old one still holds it, and hang.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "workstack"
            - name: POSTGRES_PASSWORD
              value: "workstack"
            - name: POSTGRES_DB
              value: "workstack"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "workstack", "-d", "workstack"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "workstack", "-d", "workstack"]
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
