apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: workstack
spec:
  # Starts at 1 replica deliberately: docker-entrypoint.sh runs
  # `alembic upgrade head` unconditionally on every container start with no
  # locking. Multiple replicas racing to migrate a fresh, empty database
  # could conflict on DDL. At replicas: 1 that race is structurally
  # impossible on first boot; HPA only scales up afterward, once the schema
  # is already at head, so later replicas' migration runs are safe no-ops.
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: workstack-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 300Mi
