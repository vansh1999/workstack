# Dev-only placeholder values for the local `kind` cluster — identical to the
# fake credentials already committed in backend/.env.example. Not suitable
# beyond local dev; real secret hygiene (GCP Secret Manager) lands in a later
# DevOps stage. To mint a real SECRET_KEY: python -c "import secrets; print(secrets.token_hex(32))"
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: workstack
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://workstack:workstack@postgres:5432/workstack"
  SECRET_KEY: "changeme-generate-a-real-secret-key"
