# GKE's managed Secret Manager CSI add-on (secret_manager_config.enabled on
# the cluster) does not itself provision the RBAC its own driver needs to
# perform the SecretProviderClass `secretObjects` sync-to-Kubernetes-Secret
# feature. Without this grant, the driver's ServiceAccount
# (kube-system/secrets-store-csi-driver-gke) fails with:
#   "secrets is forbidden: ... cannot list resource \"secrets\" in API
#   group \"\" at the cluster scope"
# and backend-secret never gets created. The driver's reflector issues an
# unnamespaced (cluster-scope) List/Watch on Secrets, which RBAC can only
# authorize via a ClusterRole + ClusterRoleBinding (a namespaced RoleBinding
# cannot satisfy a cluster-scoped list/watch call).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secrets-store-csi-driver-gke-secrets-sync
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secrets-store-csi-driver-gke-secrets-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secrets-store-csi-driver-gke-secrets-sync
subjects:
  - kind: ServiceAccount
    name: secrets-store-csi-driver-gke
    namespace: kube-system
