# GKE's built-in GCE ingress controller does not always auto-register the
# "gce" IngressClass object (observed: none existed even with
# addonsConfig.httpLoadBalancing enabled on this cluster). Our Ingress
# references ingressClassName: gce, which requires a matching IngressClass
# object to exist for the controller to claim it.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: gce
spec:
  controller: k8s.io/ingress-gce
