<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work Stack</title>
    <!-- Stamp the saved theme before first paint so a dark-mode reload never flashes white. -->
    <script>
      try {
        var t = localStorage.getItem('workstack-theme')
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
      } catch (e) {
        /* private window or blocked site data — fall back to the OS preference */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
