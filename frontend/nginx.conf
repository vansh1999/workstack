server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router (client-side routing) — serve index.html for any
    # unmatched path so deep links / refreshes work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend so the browser sees a single origin
    # (required for the httpOnly, SameSite=Lax auth cookie to work).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
