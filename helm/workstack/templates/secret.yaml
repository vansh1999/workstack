{{- if .Values.secret.create }}
# Dev-only placeholder values for the local `kind` cluster — plaintext via
# stringData (k8s base64-encodes it into data on creation). Not suitable
# beyond local dev; GKE uses the SecretProviderClass CSI sync instead (see
# secretproviderclass.yaml), never both at once.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "workstack.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@{{ .Values.postgres.serviceName }}:5432/{{ .Values.postgres.database }}"
  SECRET_KEY: {{ .Values.secret.secretKey | quote }}
{{- end }}
