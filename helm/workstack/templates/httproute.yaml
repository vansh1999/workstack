{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: workstack
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "workstack.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: workstack
  rules:
    - backendRefs:
        - name: frontend
          port: 8080
{{- end }}
