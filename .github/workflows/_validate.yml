name: Validate

on:
  workflow_call:

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      # user/password/db here must match Settings.TEST_DATABASE_URL's default
      # (backend/app/core/config.py) — no env override needed in this job.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workstack
          POSTGRES_PASSWORD: workstack
          POSTGRES_DB: workstack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U workstack"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: pytest
        working-directory: backend

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test
        working-directory: frontend

  frontend-build:
    name: Frontend build (TypeScript check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # `build` runs `tsc -b && vite build` — fails on type errors before
      # vite even starts, so this covers "TypeScript check" too.
      - run: npm run build
        working-directory: frontend

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: "v4.2.3"
      - run: |
          helm lint helm/workstack -f helm/workstack/values-kind.yaml
          helm lint helm/workstack -f helm/workstack/values-gke.yaml

  helm-template:
    name: Helm template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: "v4.2.3"
      - run: |
          helm template helm/workstack -f helm/workstack/values-kind.yaml
          helm template helm/workstack -f helm/workstack/values-gke.yaml

  docker-build-backend:
    name: Docker build validation (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: workstack-backend:ci-validate

  docker-build-frontend:
    name: Docker build validation (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: workstack-frontend:ci-validate
