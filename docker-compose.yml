services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: workstack
      POSTGRES_PASSWORD: workstack
      POSTGRES_DB: workstack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workstack -d workstack"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
